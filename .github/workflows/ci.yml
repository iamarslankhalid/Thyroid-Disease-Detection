name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Train and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Retrain the model from the raw data
        # Proves the pipeline is reproducible rather than trusting the
        # committed artifact, and gives the API tests a model to load.
        run: python -m ml.train

      - name: Run tests
        run: pytest -q

  frontend:
    name: Build the frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build
        working-directory: frontend
        run: npm run build
